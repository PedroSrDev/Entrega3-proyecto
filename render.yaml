# Despliegue en Render con un clic (Blueprint): crea la base de datos y el servicio web.
databases:
  - name: sgpc-db
    plan: free
    databaseName: sgpc
    user: sgpc

services:
  - type: web
    name: sgpc
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sgpc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@sgpc.com
      - key: ADMIN_PASSWORD
        sync: false
